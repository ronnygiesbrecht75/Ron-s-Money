name: Build and Release Installers (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Versión del Release (ejemplo: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------
  # 1. BUILD WINDOWS .EXE INSTALLER
  # -----------------------------------------------------------
  build-windows:
    name: Compilar Instalador Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install

      - name: Compilar App Web
        run: npm run build

      - name: Compilar Instalador Electron (.exe)
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir Instalador Windows como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  # -----------------------------------------------------------
  # 2. BUILD ANDROID .APK INSTALLER
  # -----------------------------------------------------------
  build-android:
    name: Compilar Instalador Android (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install

      - name: Compilar App Web
        run: npm run build

      - name: Agregar Plataforma Android y Sincronizar
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar Archivo APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Rons-Money-v1.0.0.apk

      - name: Subir Instalador Android como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: android-installer
          path: release-apk/*.apk
          if-no-files-found: error

  # -----------------------------------------------------------
  # 3. PUBLICAR RELEASE EN GITHUB CON AMBOS INSTALADORES
  # -----------------------------------------------------------
  publish-release:
    name: Publicar Release Oficial en GitHub
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Descargar Instalador Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: final-release

      - name: Descargar Instalador Android
        uses: actions/download-artifact@v4
        with:
          name: android-installer
          path: final-release

      - name: Determinar Nombre de Versión
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.release_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Crear GitHub Release con Instaladores (.exe y .apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: "Ron's Money ${{ steps.get_version.outputs.version }}"
          body: |
            ## 🎉 ¡Instaladores Listos de Ron's Money!
            
            Descarga la aplicación para tu dispositivo:
            
            ### 💻 Para Computadora (Windows):
            - Descarga **`Rons-Money-Setup-*.exe`**
            - Haz doble clic y sigue el asistente de instalación. Se creará automáticamente un acceso directo en tu Escritorio y Menú Inicio.
            
            ### 📱 Para Celular (Android):
            - Descarga **`Rons-Money-v1.0.0.apk`**
            - Ábrelo en tu teléfono Android y confirma la instalación.
            
            ---
            *Compilado automáticamente mediante GitHub Actions.*
          files: |
            final-release/*.exe
            final-release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
